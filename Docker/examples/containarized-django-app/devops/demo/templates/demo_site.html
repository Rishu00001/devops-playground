<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Demo</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #222;
        }

        p {
            color: #666;
        }

        .status {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: #28a745;
            color: white;
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🚀 Django DevOps Demo</h1>
        <p>Your Django application is running successfully.</p>

        <div class="status">
            Server Running ✓
        </div>
    </div>
</body>
</html>
